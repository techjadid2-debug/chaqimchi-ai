name: CI

on:
  push:
    # Ro'yxat emas, HAMMA shox.  Ilgari bu yerda uchta nom sanalgan edi va
    # ish har safar boshqa nomdagi shoxda ketardi: `loitering-rasmsiz` da
    # 27 commit CI'ga umuman kirmagan.  Nomlarni yodda tutish kerak
    # bo'lgan ro'yxat — ishlamaydigan ro'yxat.
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Ruff
        run: python -m ruff check chaqimchi_ai cloud tests scripts
      - name: Pytest
        run: python -m pytest -q
