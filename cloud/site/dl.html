<!doctype html>
<html lang="{{lang}}" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{{site.dl.title}}</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/assets/favicon.png" type="image/png">
  <link rel="stylesheet" href="{{asset:site.css}}">
  <!-- Sahifa `dl.` subdomenida o'zi turadi (host-based): nav va footer
       yo'q, bitta karta.  Til tanlagich shu hostning `/ru/`, `/en/`
       yo'llariga olib boradi. -->
  <style>
    body { display: grid; min-height: 100vh; place-items: center; background: var(--surface-inset); }
    .card { width: calc(100% - 48px); max-width: 470px; padding: 32px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); }
    .card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
    .card h1 { margin: 0 0 8px; font-size: 22px; }
    .card p { margin: 8px 0; color: var(--muted); font-size: 15px; }
    .meta { margin-top: 12px; font-size: 13px; }
    .plain { color: var(--accent-ink); }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-head">
      <a class="brand brand-lockup" href="{{path}}">
        {{inline:enes-mark.svg}}
        <span class="brand-text"><b>ENES</b><small>Monitoring</small></span>
      </a>
      {{lang_switch}}
    </div>
    <h1>{{site.dl.h1}}</h1>
    <p>{{site.dl.text}}</p>
    <a class="button button-light" id="dlBtn" href="/api/v1/public/download-installer?os=windows">{{site.dl.button}}</a>
    <p class="meta hint" id="dlMeta">{{site.dl.meta_checking}}</p>
    <p class="meta hint">{{site.dl.guide_label}} <a class="plain" href="/install">{{site.dl.guide_link}}</a></p>
  </div>
  <script type="application/json" id="page-text">
    {"version": {{json:site.dl.meta_version}}, "pending": {{json:site.dl.meta_pending}}}
  </script>
  <script src="{{asset:dl.js}}" defer></script>
</body>
</html>
