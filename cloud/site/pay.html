<!doctype html>
<html lang="uz" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/assets/favicon.png" type="image/png">
  <title>To‘lov — ENES Monitoring</title>
  <!-- 2026-09-08: eski panel uslub fayllari o'rniga `site.css` — sayt
       bilan bitta dizayn tizimi.  Sahifaga xos
       qoidalar shu yerda: `site.css` ni o'n uch sahifa bo'lishadi va
       to'lov ekrani uchun uni kattalashtirish shart emas. -->
  <link rel="stylesheet" href="{{asset:site.css}}">
  <style>
    .pay-shell { max-width: 480px; margin: 6vh auto 0; padding: 0 16px 60px; }
    .pay-shell .brand { justify-content: center; width: 100%; margin-bottom: 18px; }
    .pay-card { padding: 28px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); }
    .amount { margin: 6px 0; font-size: 34px; font-weight: 800; letter-spacing: -.03em; }
    /* Payme va Click tugmalari o'z brend rangida — mijoz ularni taniydi. */
    .pay-btn { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 48px; margin-top: 10px; border-radius: 999px; font-weight: 700; text-decoration: none; color: #0a0c10; }
    .pay-payme { background: #33cccc; }
    .pay-click { background: #40b6e8; }
    .status-banner { padding: 14px 16px; border-radius: 12px; font-weight: 700; }
    .status-banner .sub { display: block; margin-top: 4px; font-weight: 500; font-size: 13px; }
    .status-banner.ok { background: var(--green-soft); color: var(--green-ink); }
    .status-banner.warn { background: var(--yellow-soft); color: var(--yellow-ink); }
    .status-banner.err { background: var(--red-soft); color: var(--red-ink); }
    .note { padding: 12px 14px; border-radius: 12px; background: var(--yellow-soft); color: var(--yellow-ink); font-size: 14px; }
    .note b { display: block; margin-bottom: 4px; }
    .action-row { display: grid; gap: 8px; margin-top: 16px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; word-break: break-all; }
  </style>
</head>
<body class="utility-page">
  <div class="pay-shell">
    <a class="brand brand-lockup" href="__APP_URL__">
      {{inline:enes-mark.svg}}
      <span class="brand-text"><b>ENES</b><small>Monitoring</small></span>
    </a>
    <div class="pay-card" id="box"><p class="hint">Yuklanmoqda…</p></div>
    <p class="hint" style="text-align: center">
      To‘lov Payme yoki Click orqali xavfsiz amalga oshiriladi.
    </p>
  </div>

  <script>
    // Mijozga sotilgan nom bilan bir xil bo'lishi shart: saytda
    // "Lite" deb yozilgan, bu yerda ichki kod nomi turmasin.
    const PLAN_LABEL = { lite: "ENES Lite" };
    const uzs = (n) => Number(n || 0).toLocaleString("ru-RU") + " so'm";
    const esc = (s) =>
      String(s ?? "").replace(/[&<>"']/g, (c) =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]
      );

    // Har boshi berk ko'chada chiqish yo'li bo'lishi kerak.  Ilgari
    // mijozga menejerga murojaat qilish taklif qilinardi, lekin sahifada
    // na telefon, na Telegram bor edi — u pul to'lay olmay qolib ketardi.
    const HELP = `
      <div class="action-row">
        <a class="button button-light" href="__TELEGRAM_REGISTER_URL__">Telegramda yozish</a>
        <a class="button button-ghost" href="tel:+998932225070">+998 93 222 50 70</a>
        <a class="button button-ghost" href="__APP_URL__">Panelga qaytish</a>
      </div>`;

    const invoiceId = location.pathname.split("/").filter(Boolean).pop();

    function renderPaid(inv) {
      return `
        <div class="status-banner ok">To'lov qabul qilindi
          <span class="sub">${esc(inv.months)} oylik obuna faollashtirildi.</span></div>
        ${HELP}`;
    }

    function renderCancelled() {
      return `
        <div class="status-banner warn">Bu hisob bekor qilingan
          <span class="sub">Yangi hisob ochish uchun bizga yozing.</span></div>
        ${HELP}`;
    }

    function renderPending(inv) {
      const buttons = [
        inv.payme_url
          ? `<a class="pay-btn pay-payme" href="${esc(inv.payme_url)}">Payme orqali to'lash</a>`
          : "",
        inv.click_url
          ? `<a class="pay-btn pay-click" href="${esc(inv.click_url)}">Click orqali to'lash</a>`
          : "",
      ].join("");

      return `
        <div class="hint">${esc(inv.site_name || "")}</div>
        <div class="amount">${uzs(inv.amount_uzs)}</div>
        <div class="hint">${esc(PLAN_LABEL[inv.plan] || inv.plan)} · ${esc(inv.months)} oy</div>
        ${buttons || `
          <div class="note" style="margin-top: 14px"><b>Onlayn to'lov hozircha ulanmagan</b>
            Naqd yoki bank o'tkazmasi uchun bizga yozing — hisobni biz yopamiz.</div>
          ${HELP}`}
        <details style="margin-top: 16px">
          <summary class="hint">Hisob raqami</summary>
          <p class="mono">${esc(inv.id)}</p>
        </details>`;
    }

    (async () => {
      const box = document.getElementById("box");
      try {
        const res = await fetch(`/api/v1/invoices/${encodeURIComponent(invoiceId)}`);
        if (!res.ok) throw new Error("Bu hisob topilmadi yoki muddati o'tgan");
        const inv = await res.json();
        box.innerHTML =
          inv.state === "paid" ? renderPaid(inv)
          : inv.state === "cancelled" ? renderCancelled()
          : renderPending(inv);
      } catch (err) {
        // Xom xato matni ("Failed to fetch") mijozga hech narsa aytmaydi —
        // unga nima qilishni aytadigan yo'l kerak.
        box.innerHTML = `
          <div class="status-banner err">${esc(err.message)}
            <span class="sub">Havolani qaytadan oching yoki bizga yozing.</span></div>
          ${HELP}`;
      }
    })();
  </script>
</body>
</html>
