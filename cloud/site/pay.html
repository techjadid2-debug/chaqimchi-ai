<!doctype html>
<html lang="uz" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/assets/favicon.png" type="image/png">
  <title>To‘lov — ENES Monitoring</title>
  <!-- 2026-09-08: eski panel uslub fayllari o'rniga `site.css` — sayt
       bilan bitta dizayn tizimi.  Sahifaga xos
       qoidalar shu yerda: `site.css` ni o'n uch sahifa bo'lishadi va
       to'lov ekrani uchun uni kattalashtirish shart emas. -->
  <link rel="stylesheet" href="{{asset:site.css}}">
  <style>
    .pay-shell { max-width: 480px; margin: 6vh auto 0; padding: 0 16px 60px; }
    .pay-shell .brand { justify-content: center; width: 100%; margin-bottom: 18px; }
    .pay-card { padding: 28px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); }
    .amount { margin: 6px 0; font-size: 34px; font-weight: 800; letter-spacing: -.03em; }
    /* Payme va Click tugmalari o'z brend rangida — mijoz ularni taniydi. */
    .pay-btn { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 48px; margin-top: 10px; border-radius: 999px; font-weight: 700; text-decoration: none; color: #0a0c10; }
    .pay-payme { background: #33cccc; }
    .pay-click { background: #40b6e8; }
    .status-banner { padding: 14px 16px; border-radius: 12px; font-weight: 700; }
    .status-banner .sub { display: block; margin-top: 4px; font-weight: 500; font-size: 13px; }
    .status-banner.ok { background: var(--green-soft); color: var(--green-ink); }
    .status-banner.warn { background: var(--yellow-soft); color: var(--yellow-ink); }
    .status-banner.err { background: var(--red-soft); color: var(--red-ink); }
    .note { padding: 12px 14px; border-radius: 12px; background: var(--yellow-soft); color: var(--yellow-ink); font-size: 14px; }
    .note b { display: block; margin-bottom: 4px; }
    .action-row { display: grid; gap: 8px; margin-top: 16px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; word-break: break-all; }
  </style>
</head>
<body class="utility-page">
  <div class="pay-shell">
    <a class="brand brand-lockup" href="__APP_URL__">
      {{inline:enes-mark.svg}}
      <span class="brand-text"><b>ENES</b><small>Monitoring</small></span>
    </a>
    <div class="pay-card" id="box"><p class="hint">Yuklanmoqda…</p></div>
    <p class="hint" style="text-align: center">
      To‘lov Payme yoki Click orqali xavfsiz amalga oshiriladi.
    </p>
  </div>

  <script type="application/json" id="page-links">
    {"telegram": "__TELEGRAM_REGISTER_URL__", "app": "__APP_URL__"}
  </script>
  <script src="{{asset:pay.js}}" defer></script>
</body>
</html>
