<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Chaqimchi Cloud — Admin</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <!-- Dizayn tili mijoz paneli bilan bitta: ranglar va asosiy elementlar
       owner.css dan, yon menyu va admin qismlari panel.css dan keladi.
       Eski qorong'u uslub bu yerda ATAYLAB yo'q — u o'rnatuvchi paneli va
       to'lov sahifasida qoladi. -->
  <link rel="stylesheet" href="/assets/owner.css" />
  <link rel="stylesheet" href="/assets/panel.css" />
</head>
<body>
  <!-- ── Kirish ekrani ──────────────────────────────────────────────── -->
  <section id="login" class="login-wrap">
    <a class="brand" href="/"><img src="/assets/chaqimchi-logo-v2.webp" alt="" />Chaqimchi <b>Cloud</b></a>
    <div class="card">
      <h2>Admin paneli</h2>
      <p class="hint" style="margin: 0 0 14px">Login va parolingizni kiriting.</p>
      <!-- `required` ataylab yo'q: zaxira kalit bilan kirganda login va
           parol bo'sh qoladi, brauzer esa formani yubormay qo'yardi. -->
      <form id="loginForm" novalidate>
        <label class="field" for="adminUsername">Login<input id="adminUsername" type="text" autocomplete="username" /></label>
        <label class="field" for="adminPassword">Parol<input id="adminPassword" type="password" autocomplete="current-password" /></label>
        <div id="loginError" class="note err hidden"></div>
        <button class="button primary" type="submit" style="width: 100%">Kirish</button>
        <details class="alt-login">
          <summary>Zaxira admin kaliti</summary>
          <label class="field" for="adminKey">Kalit<input id="adminKey" type="password" autocomplete="off" /></label>
          <p class="hint">Login ishlamay qolganda ishlatiladi. Odatda kerak emas.</p>
        </details>
      </form>
    </div>
  </section>

  <!-- ── Panel ──────────────────────────────────────────────────────── -->
  <div id="app" class="admin-shell hidden">
    <header class="topbar-mobile">
      <button class="button ghost small" type="button" data-act="nav-toggle" aria-label="Menyu">Menyu</button>
      <span class="brand">Chaqimchi <b>Cloud</b></span>
    </header>

    <aside id="sidenav" class="sidenav">
      <a class="brand" href="#/boshqaruv"><img src="/assets/chaqimchi-logo-v2.webp" alt="" />Chaqimchi <b>Cloud</b></a>
      <nav id="navList" aria-label="Bo'limlar"></nav>
      <div class="nav-foot">
        <button class="button ghost small" type="button" data-act="refresh" style="margin-bottom: 6px">Yangilash</button>
        <button class="button ghost small" type="button" data-act="logout">Chiqish</button>
      </div>
    </aside>

    <div id="drawerBackdrop" class="drawer-backdrop hidden" data-act="nav-toggle"></div>
    <main id="content" class="content"></main>
  </div>

  <div id="modalRoot" class="hidden"></div>
  <div id="toast" hidden></div>

  <!-- Yangi mijoz formasi statik markup: tarif ro'yxati kod bilan bir
       joyda turishi uchun (tests/test_plans.py buni tekshiradi). -->
  <template id="tplCreateSite">
    <form data-create-site>
      <label class="field">Mijoz / do'kon nomi
        <input id="cName" type="text" required placeholder="Masalan: Chorsu do'koni" />
      </label>
      <div class="grid-2">
        <label class="field">Tarif
          <select id="cPlan">
            <option value="biznes" selected>Biznes — 299 000 so'm/oy · 4 kamera</option>
            <option value="boshlangich">Boshlang'ich — 149 000 so'm/oy · 2 kamera</option>
          </select>
        </label>
        <label class="field">Obuna (oy)
          <input id="cMonths" type="number" min="1" max="60" value="1" />
        </label>
      </div>
      <div class="grid-2">
        <label class="field">Telefon<input id="cPhone" type="tel" placeholder="+998 90 000 00 00" /></label>
        <label class="field">Manzil<input id="cAddress" type="text" placeholder="Toshkent, ..." /></label>
      </div>
      <button class="button primary" type="submit">Mijoz ochish</button>
    </form>
  </template>

  <script>
    // ── Platforma manzillari ───────────────────────────────────────────
    // Yuklab olish dl'dan, qurilma buyrug'i api'dan keladi.  location.origin
    // admin subdomenini ko'rsatadi — u bu ishlarga to'g'ri kelmaydi.
    const PLATFORM = { apex: location.origin, app: location.origin, api: location.origin, dl: location.origin };
    fetch("/api/v1/public/urls")
      .then((r) => (r.ok ? r.json() : null))
      .then((data) => { if (data) Object.assign(PLATFORM, data); })
      .catch(() => {});

    const KEY_STORAGE = "chaqimchi_admin_token";
    const LEGACY_KEY_STORAGE = "chaqimchi_admin_key";
    let adminToken = sessionStorage.getItem(KEY_STORAGE) || "";
    let adminKey = sessionStorage.getItem(LEGACY_KEY_STORAGE) || "";

    const $ = (id) => document.getElementById(id);
    const esc = (s) =>
      String(s ?? "").replace(/[&<>"']/g, (c) =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

    // ── Nomlar: ichki kodlar hech qachon ekranga chiqmaydi ─────────────
    const PLAN_LABEL = {
      lite: "Chaqimchi Lite",
      starter: "Starter", business: "Business", enterprise: "Enterprise",
      staff_starter: "Davomat S", staff_business: "Davomat M", staff_enterprise: "Davomat L",
    };
    const STATUS_LABEL = {
      active: "Faol", grace: "To'lov kutilmoqda",
      expired: "Muddati tugagan", suspended: "To'xtatilgan",
    };
    const STATUS_BADGE = { active: "ok", grace: "warn", expired: "err", suspended: "mute" };
    const CONN_LABEL = {
      online: "Ishlayapti", stale: "Aloqa uzilgan",
      offline: "Ishlamayapti", not_paired: "Hali ulanmagan",
    };
    const CONN_BADGE = { online: "ok", stale: "warn", offline: "err", not_paired: "mute" };
    const INVOICE_LABEL = { pending: "Kutilmoqda", paid: "To'langan", cancelled: "Bekor qilingan" };
    const INVOICE_BADGE = { pending: "warn", paid: "ok", cancelled: "mute" };
    const LEAD_LABEL = {
      new: "Yangi", contacted: "Bog'lanildi", qualified: "Mos",
      converted: "Mijoz bo'ldi", closed: "Yopildi",
    };
    const LEAD_BADGE = { new: "warn", contacted: "ok", qualified: "ok", converted: "ok", closed: "mute" };
    const ACCOUNT_ROLE = { admin: "Admin", installer: "O'rnatuvchi", customer: "Mijoz" };
    const ACCOUNT_STATUS = { pending: "Tasdiq kutilmoqda", active: "Faol", disabled: "Bloklangan" };
    const ACCOUNT_BADGE = { active: "ok", pending: "warn", disabled: "err" };
    const ASSIGN_LABEL = { assigned: "Biriktirildi", completed: "Bajarildi", cancelled: "Bekor qilingan" };
    const PROBE_LABEL = { online: "Rasm keladi", error: "Rasm kelmadi", pending: "Tekshirilmagan" };
    const PROBE_BADGE = { online: "ok", error: "err", pending: "mute" };
    const CONFIG_LABEL = { applied: "Sozlama qabul qilindi", pending: "Sozlama yuborildi, kutilmoqda", error: "Sozlamada xato" };

    const uzs = (n) => Number(n || 0).toLocaleString("ru-RU") + " so'm";
    const monthly = (amount, usdAmount = 0) =>
      usdAmount ? `$${Number(usdAmount).toLocaleString("en-US")}/oy ≈ ${uzs(amount)}` : `${uzs(amount)}/oy`;

    // "3 soat oldin" — xom UTC vaqtdan ko'ra tezroq o'qiladi.
    function sinceLabel(minutes) {
      if (minutes == null) return "aloqa bo'lmagan";
      if (minutes < 60) return `${minutes} daqiqa oldin`;
      const hours = Math.floor(minutes / 60);
      if (hours < 24) return `${hours} soat oldin`;
      return `${Math.floor(hours / 24)} kun oldin`;
    }
    const day = (s) => String(s || "").slice(0, 10) || "—";
    const badge = (text, kind = "mute") => `<span class="badge ${kind}">${esc(text)}</span>`;
    // Sayt/hisob ID'lari faqat manzilga va API yo'liga tushadi — begona
    // belgilar kirmasligi kerak.
    const SAFE_ID = /^[A-Za-z0-9_-]{1,64}$/;

    // ── API ────────────────────────────────────────────────────────────
    function authHeaders() {
      if (adminToken) return { Authorization: `Bearer ${adminToken}` };
      if (adminKey) return { "X-Cloud-Admin-Key": adminKey };
      return {};
    }

    async function api(path, options = {}) {
      const res = await fetch(path, {
        ...options,
        headers: { "Content-Type": "application/json", ...authHeaders(), ...(options.headers || {}) },
      });
      if (!res.ok) {
        let detail = `Xato ${res.status}`;
        try {
          const body = await res.json();
          if (body.detail) detail = body.detail;
        } catch (_) {}
        const err = new Error(detail);
        err.status = res.status;
        throw err;
      }
      return res.json();
    }

    // Xabarnoma ekran pastida suzadi: qaysi tugmani bosgan bo'lsangiz ham
    // javob ko'rinadi (ilgari u sahifa tepasida qolib ketardi).
    function notify(message, ok = true) {
      const el = $("toast");
      el.textContent = message;
      el.className = ok ? "ok" : "err";
      el.hidden = false;
      clearTimeout(notify._t);
      notify._t = setTimeout(() => (el.hidden = true), 6000);
    }

    async function copyText(text) {
      try {
        await navigator.clipboard.writeText(text);
        notify("Nusxalandi");
      } catch (_) {
        notify("Nusxalab bo'lmadi — matnni qo'lda belgilang", false);
      }
    }

    function emptyState({ title, hint = "", actionLabel = "", actionHref = "", actionAct = "" }) {
      const action = actionLabel
        ? (actionHref
            ? `<a class="button primary" href="${esc(actionHref)}">${esc(actionLabel)}</a>`
            : `<button class="button primary" type="button" data-act="${esc(actionAct)}">${esc(actionLabel)}</button>`)
        : "";
      return `<div class="empty"><b>${esc(title)}</b>${hint ? esc(hint) : ""}${action}</div>`;
    }

    // ── Oynalar (brauzer prompt/confirm o'rniga) ───────────────────────
    let modalClose = null;

    function closeModal() {
      const root = $("modalRoot");
      root.className = "hidden";
      root.innerHTML = "";
      document.removeEventListener("keydown", modalKeydown);
      const done = modalClose;
      modalClose = null;
      if (done) done();
    }

    function modalKeydown(e) {
      if (e.key === "Escape") closeModal();
    }

    /**
     * Bitta oyna tizimi. `onSubmit` berilsa forma bo'ladi (Saqlash tugmasi
     * bilan), berilmasa faqat ma'lumot ko'rsatadi.  `onSubmit` xato tashlasa
     * oyna yopilmaydi va sabab shu yerning o'zida ko'rinadi.
     */
    function openModal({ title, html = "", submitLabel = "Saqlash", cancelLabel = "Bekor qilish",
                         danger = false, wide = false, onSubmit = null, onReady = null }) {
      return new Promise((resolve) => {
        if (modalClose) closeModal();
        modalClose = () => resolve();
        const root = $("modalRoot");
        root.className = "modal-backdrop";
        root.innerHTML = `
          <div class="modal${wide ? "" : " form-modal"}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
            <div class="modal-head"><b>${esc(title)}</b>
              <button class="button ghost small" type="button" data-modal-close>Yopish</button></div>
            <form data-modal-form novalidate>
              <div data-modal-body>${html}</div>
              <div class="note err hidden" data-modal-error></div>
              ${onSubmit ? `<div class="modal-foot">
                <button class="button ghost" type="button" data-modal-close>${esc(cancelLabel)}</button>
                <button class="button ${danger ? "danger" : "primary"}" type="submit">${esc(submitLabel)}</button>
              </div>` : ""}
            </form>
          </div>`;
        document.addEventListener("keydown", modalKeydown);

        const form = root.querySelector("[data-modal-form]");
        const errBox = root.querySelector("[data-modal-error]");
        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          if (!onSubmit) return; // Ma'lumot oynasi: Enter tasodifan yopmasin.
          const submitBtn = form.querySelector("button[type=submit]");
          submitBtn.disabled = true;
          errBox.classList.add("hidden");
          try {
            await onSubmit(form);
            closeModal();
          } catch (err) {
            errBox.textContent = err.message;
            errBox.classList.remove("hidden");
            submitBtn.disabled = false;
          }
        });
        // Tanlov qatorini bosganda radio ham belgilanadi va ko'rinishi o'zgaradi.
        form.addEventListener("change", () => {
          form.querySelectorAll(".choice").forEach((row) => {
            const input = row.querySelector("input[type=radio]");
            if (input) row.classList.toggle("on", input.checked);
          });
        });
        form.querySelectorAll(".choice input[type=radio]:checked").forEach((i) => i.closest(".choice").classList.add("on"));
        if (onReady) onReady(form);
        const first = form.querySelector("input:not([type=radio]):not([type=hidden]), select, textarea");
        if (first) first.focus();
      });
    }

    // Fon yoki "Yopish" bosilsa oyna yopiladi.  Tinglovchi bir marta
    // qo'yiladi: har openModal'da qo'shilsa ular to'planib ketardi.
    $("modalRoot").addEventListener("click", (e) => {
      if (e.target === e.currentTarget || e.target.closest("[data-modal-close]")) closeModal();
    });

    /** Tasdiqlash. `typed` berilsa foydalanuvchi aynan shu matnni yozadi. */
    function confirmDialog({ title, text, confirmLabel = "Ha", danger = false, typed = null }) {
      return new Promise((resolve) => {
        let answered = false;
        openModal({
          title,
          html: `<p style="margin: 0">${esc(text)}</p>` + (typed
            ? `<label class="field" style="margin-top: 14px">Tasdiqlash uchun <b>${esc(typed)}</b> deb yozing
                 <input type="text" data-typed autocomplete="off" /></label>`
            : ""),
          submitLabel: confirmLabel,
          cancelLabel: "Yo'q",
          danger,
          onSubmit: (form) => {
            if (typed && form.querySelector("[data-typed]").value.trim() !== typed) {
              throw new Error("Nom mos kelmadi — xatosiz ko'chiring");
            }
            answered = true;
          },
        }).then(() => resolve(answered));
      });
    }

    // ── Ma'lumot: har bo'lim faqat o'ziga keraklisini yuklaydi ─────────
    // Ilgari har bosishda 11 ta so'rov ketardi va sahifa "sakrardi".
    const S = {
      stats: null, sites: null, leads: null, invoices: null, providers: null,
      alerts: null, readiness: null, catalog: null, templates: null,
      accounts: null, assignments: null, updates: null,
    };
    const LOADERS = {
      stats: () => api("/api/v1/admin/stats"),
      sites: () => api("/api/v1/admin/sites"),
      leads: () => api("/api/v1/admin/leads?limit=100"),
      invoices: () => api("/api/v1/admin/invoices?limit=50"),
      providers: () => api("/api/v1/admin/payments/providers"),
      alerts: () => api("/api/v1/admin/alerts"),
      readiness: () => api("/api/v1/admin/readiness"),
      catalog: () => api("/api/v1/admin/features"),
      templates: () => api("/api/v1/admin/business-templates"),
      accounts: () => api("/api/v1/admin/accounts").then((d) => d.accounts || []),
      assignments: () => api("/api/v1/admin/installer-assignments").then((d) => d.assignments || []),
      updates: () => api("/api/v1/admin/updates-paused"),
    };

    async function need(keys) {
      const missing = keys.filter((k) => S[k] === null);
      if (!missing.length) return;
      const values = await Promise.all(missing.map((k) => LOADERS[k]()));
      missing.forEach((k, i) => (S[k] = values[i]));
    }
    function invalidate(...keys) { keys.forEach((k) => (S[k] = null)); }
    async function reload(...keys) { invalidate(...keys); await renderCurrent(); }

    const siteById = (id) => (S.sites || []).find((s) => s.id === id);

    // ── Navigatsiya ────────────────────────────────────────────────────
    const NAV = [
      { id: "boshqaruv", label: "Boshqaruv", deps: ["stats", "sites", "leads", "invoices", "readiness"], render: renderDashboard },
      // `accounts` mijoz sahifasida ham kerak: do'kon egasining panel
      // logini bor-yo'qligi shundan bilinadi.
      { id: "mijozlar", label: "Mijozlar", deps: ["sites", "accounts"],
        render: (el, param) => (param ? renderCustomerDetail(el, param) : renderCustomers(el)) },
      { id: "tolovlar", label: "To'lovlar", deps: ["invoices", "providers"], render: renderPayments },
      { id: "arizalar", label: "Arizalar", deps: ["leads"], render: renderLeads,
        badge: () => (S.leads || []).filter((l) => l.status === "new").length },
      { id: "jamoa", label: "Jamoa", deps: ["accounts", "assignments", "sites"], render: renderTeam },
      { id: "sozlamalar", label: "Sozlamalar",
        deps: ["readiness", "catalog", "providers", "alerts", "updates"], render: renderSettings },
    ];

    function currentRoute() {
      const raw = (location.hash || "").replace(/^#\/?/, "");
      const [id, param] = raw.split("/");
      return { section: NAV.find((n) => n.id === id) || NAV[0], param: param || null };
    }

    function go(hash) {
      if (location.hash === hash) renderCurrent();
      else location.hash = hash;
    }

    function renderNav() {
      const { section } = currentRoute();
      $("navList").innerHTML = NAV.map((item) => {
        const count = item.badge ? item.badge() : 0;
        return `<a class="nav-link${item.id === section.id ? " active" : ""}" href="#/${item.id}"
                   ${item.id === section.id ? 'aria-current="page"' : ""}>${esc(item.label)}
                 ${count ? `<span class="nav-badge">${count}</span>` : ""}</a>`;
      }).join("");
    }

    let renderToken = 0;
    async function renderCurrent() {
      const { section, param } = currentRoute();
      const el = $("content");
      const token = ++renderToken;
      el.innerHTML = '<p class="hint">Yuklanmoqda…</p>';
      try {
        await need(section.deps);
        if (token !== renderToken) return;
        await section.render(el, param);
        renderNav();
      } catch (err) {
        if (token !== renderToken) return;
        el.innerHTML = `<div class="note err"><b>Ma'lumot kelmadi</b>${esc(err.message)}</div>`;
      }
    }

    function toggleDrawer(force) {
      const open = force === undefined ? !$("sidenav").classList.contains("open") : force;
      $("sidenav").classList.toggle("open", open);
      $("drawerBackdrop").classList.toggle("hidden", !open);
    }

    window.addEventListener("hashchange", () => { toggleDrawer(false); renderCurrent(); });

    // ── Boshqaruv ──────────────────────────────────────────────────────
    /** "Bugun nima qilishim kerak?" — bitta ro'yxat, hammasi bosiladi. */
    function attentionJobs() {
      const broken = [], unpaid = [], expiring = [], cameras = [], fresh = [], setup = [];
      (S.sites || []).forEach((site) => {
        const live = site.license_status === "active" || site.license_status === "grace";
        if (live && (site.connection === "offline" || site.connection === "not_paired")) {
          broken.push({
            level: "err", href: `#/mijozlar/${site.id}`,
            text: `«${site.name}» ishlamayapti`,
            sub: site.connection === "not_paired"
              ? "Do'kon kompyuteri hali ulanmagan"
              : `${sinceLabel(site.minutes_since_seen)} aloqa bo'lgan`,
          });
        }
        if (site.license_status === "active" && site.days_left <= 7) {
          expiring.push({
            level: "warn", href: `#/mijozlar/${site.id}`,
            text: `«${site.name}» obunasi ${site.days_left} kundan keyin tugaydi`,
            sub: `Tugash sanasi: ${day(site.subscription_until)}`,
          });
        }
        if (live && site.cameras_expected && !site.cameras_ok) {
          cameras.push({
            level: "warn", href: `#/mijozlar/${site.id}`,
            text: `«${site.name}» — ${site.cameras_expected} kameradan ${site.cameras_active} tasi ishlayapti`,
            sub: "Kamera ro'yxatini tekshiring",
          });
        }
      });
      (S.invoices || []).filter((i) => i.state === "pending").forEach((inv) => {
        unpaid.push({
          level: "warn", href: "#/tolovlar",
          text: `«${inv.site_name || "Mijoz"}» to'lamagan: ${uzs(inv.amount_uzs)}`,
          sub: `Hisob ochilgan: ${day(inv.created_at)}`,
        });
      });
      (S.leads || []).filter((l) => l.status === "new").forEach((lead) => {
        fresh.push({
          level: "warn", href: "#/arizalar",
          text: `Yangi ariza: ${leadTitle(lead)}`,
          sub: `${lead.phone || ""} · ${lead.city || "shahar ko'rsatilmagan"}`,
        });
      });
      const items = (S.readiness && Array.isArray(S.readiness.items)) ? S.readiness.items : [];
      items.filter((i) => i.required && !i.ok).forEach((item) => {
        setup.push({ level: "warn", href: "#/sozlamalar", text: `Sozlanmagan: ${item.label}`, sub: "Tizim tayyorligi" });
      });
      return [...broken, ...unpaid, ...expiring, ...cameras, ...fresh, ...setup];
    }

    async function renderDashboard(el) {
      const s = S.stats || {};
      const jobs = attentionJobs();
      const brokenCount = jobs.filter((j) => j.level === "err").length;
      const activeCount = Number(s.active || 0);

      let banner;
      if (brokenCount) {
        banner = `<div class="status-banner err">${esc(brokenCount)} ta do'kon ishlamayapti
          <span class="sub">Pastdagi ro'yxatdan ochib ko'ring</span></div>`;
      } else if (jobs.length) {
        banner = `<div class="status-banner warn">Diqqat talab qiladigan ${jobs.length} ta ish bor
          <span class="sub">Hammasi pastda ro'yxatda</span></div>`;
      } else {
        banner = `<div class="status-banner ok">Hammasi joyida
          <span class="sub">${activeCount} ta mijoz ishlayapti</span></div>`;
      }

      const down = Number(s.offline || 0) + Number(s.not_paired || 0);
      const tiles = [
        { label: "Faol mijozlar", value: activeCount, sub: `jami ${Number(s.total_sites || 0)}`, href: "#/mijozlar" },
        { label: "Ishlamayapti", value: down, sub: down ? "qo'ng'iroq qilish kerak" : "hammasi aloqada", alert: down > 0, href: "#/mijozlar" },
        { label: "Oylik daromad", value: uzs(s.monthly_revenue_uzs), sub: "faol obunalardan" },
        { label: "Kutilayotgan to'lov", value: uzs(s.pending_amount_uzs), sub: "ochilgan hisoblar", href: "#/tolovlar" },
      ];
      const tilesHtml = tiles.map((t) => {
        // Summalar uzun bo'ladi ("1 260 000 so'm") — ular kichikroq shriftda
        // yoziladi, aks holda plitka ichida ikki qatorga bo'linadi.
        const long = String(t.value).length > 9 ? " long" : "";
        const inner = `<small>${esc(t.label)}</small><strong class="${long.trim()}">${esc(t.value)}</strong><span>${esc(t.sub)}</span>`;
        const cls = `stat${t.alert ? " alert" : ""}`;

      { id: "hammasi", label: "Hammasi", test: () => true },
      { id: "buzuq", label: "Ishlamayapti", test: (s) => s.connection === "offline" || s.connection === "not_paired" },
      { id: "tugayapti", label: "Muddati tugayapti", test: (s) => s.license_status === "active" && s.days_left <= 7 },

      const filter = CUST_FILTERS.find((f) => f.id === custFilter) || CUST_FILTERS[0];
      const q = custQuery.trim().toLowerCase();
      const list = (S.sites || []).filter((s) =>
        filter.test(s) &&
        (!q || String(s.name || "").toLowerCase().includes(q) || String(s.contact_phone || "").includes(q)));
      if (!list.length) {
        return emptyState((S.sites || []).length
          ? { title: "Bu shartga mos mijoz yo'q", hint: "Qidiruvni yoki filtrni o'zgartiring." }
          : { title: "Hali mijoz yo'q", hint: "Birinchi do'konni yuqoridagi shakl orqali oching." });

      return `<div class="cust-list">${list.map((s) => `

            <small>${s.cameras_expected ? `${s.cameras_expected} kameradan ${s.cameras_active} tasi` : "kamera kiritilmagan"}

          <span class="marks">
            ${badge(STATUS_LABEL[s.license_status] || s.license_status, STATUS_BADGE[s.license_status] || "mute")}

        banner = `<div class="status-banner err">Qurilma ${esc(sinceLabel(d.minutes_since_seen))} jim<span class="sub">Do'kondagi kompyuter va internetni tekshiring</span></div>`;
      } else if (d.cameras_expected && !d.cameras_ok) {

      const cameraRows = (inventory.cameras || []).length

      const devices = (d.devices || []).map((dev, i) => `

          <span class="hint">${esc(sinceLabel(dev.minutes_since_seen))}</span>
        </div>`).join("");

      // Bajarilganlari yig'ib qo'yiladi: ekranda faqat qolgan ishlar tursin.
      const stepRow = (step) => `<div class="member-row">
        <span class="who"><b>${esc(step.label)}</b></span>
        ${badge(step.done ? "Bajarildi" : "Kutilmoqda", step.done ? "ok" : "mute")}</div>`;
      const doneSteps = onboarding ? onboarding.steps.filter((s) => s.done) : [];
      const todoSteps = onboarding ? onboarding.steps.filter((s) => !s.done) : [];
      const steps = onboarding
        ? `<p class="hint" style="margin: 0 0 10px">${onboarding.completed}/${onboarding.total} bosqich bajarilgan</p>
           ${todoSteps.length
             ? todoSteps.map(stepRow).join("")
             : '<div class="note ok"><b>Ulanish tugallangan</b>Hamma bosqich bajarilgan.</div>'}
           ${doneSteps.length ? `<details style="margin-top: 10px"><summary><b>${doneSteps.length} ta bajarilgan bosqich</b></summary>
             <div style="margin-top: 10px">${doneSteps.map(stepRow).join("")}</div></details>` : ""}`
        : `<p class="hint">Bosqichlar ma'lumoti kelmadi.</p>`;

      const portalLogin = (S.accounts || []).find(
        (a) => a.role === "customer" && a.site_id === d.id && a.status !== "disabled");

      const codes = (d.active_pairing_codes || []).length
        ? d.active_pairing_codes.map((c) => `<div class="mono">${esc(c.code)} <span class="hint">(${esc(c.expires_at.slice(0, 16))} gacha)</span></div>`).join("")
        : '<span class="hint">Faol kod yo\'q</span>';

      el.innerHTML = `
        <a class="back-link" href="#/mijozlar">← Mijozlar</a>
        <div class="detail-head">

        </div>
        <p class="detail-sub">${esc(d.contact_phone || "telefon kiritilmagan")} · ${esc(d.address || "manzil kiritilmagan")}</p>
        ${banner}

        <section class="card">
          <div class="card-head"><h2>Qurilma va kamera</h2></div>
          ${cameraRows}
          ${devices || '<p class="hint">Do\'kon kompyuteri hali ulanmagan.</p>'}
          <div class="action-row">
            <button class="button primary" type="button" data-act="camera-add" data-id="${esc(d.id)}">Kamera qo'shish</button>
            <button class="button ghost" type="button" data-act="cameras" data-id="${esc(d.id)}">Kamera soni</button>
            <button class="button ghost" type="button" data-act="pairing" data-id="${esc(d.id)}">Yangi ulanish havolasi</button>
            <button class="button ghost" type="button" data-act="update-policy" data-id="${esc(d.id)}">Yangilanish siyosati</button>
          </div>
        </section>

        <section class="card">
          <div class="card-head"><h2>Kirish va a'zolar</h2></div>
          ${steps}
          <div class="member-row">
            <span class="who"><b>Panel logini</b>
              <small>${portalLogin

          </div>

            <button class="button ghost" type="button" data-act="owner-link" data-id="${esc(d.id)}">Kirish havolasi yaratish</button>

        </section>

        <section class="card">
          <div class="card-head"><h2>Tarif va to'lov</h2></div>
          <dl class="kv">

            <button class="button ghost" type="button" data-act="invoice-new" data-id="${esc(d.id)}">Hisob ochish</button>
            <button class="button ghost" type="button" data-act="extend" data-id="${esc(d.id)}">To'lovsiz uzaytirish</button>
          </div>
        </section>

        <details class="card" data-faces-card data-id="${esc(d.id)}">
          <summary><b>Yuz tanish (yopiq pilot)</b></summary>
          <div data-faces-host style="margin-top: 14px"><p class="hint">Yuklanmoqda…</p></div>
        </details>

        <section class="card danger">
          <div class="card-head"><h2>Xavfli amallar</h2></div>
          <p class="hint" style="margin-top: 0">Obunani to'xtatsangiz do'konda tahlil darhol to'xtaydi.</p>
          <div class="action-row">
            <button class="button ${suspended ? "ghost" : "danger"}" type="button"
              data-act="status" data-id="${esc(d.id)}" data-to="${suspended ? "active" : "suspended"}">
              ${suspended ? "Qayta yoqish" : "Obunani to'xtatish"}
            </button>
          </div>
        </section>

        <details class="card quiet">
          <summary><b>Texnik ma'lumot</b></summary>
          <dl class="kv" style="margin-top: 14px">
            <dt>Ichki raqam</dt><dd><span class="mono">${esc(d.id)}</span>

            <dt>Ulanish kodi</dt><dd>${codes}</dd>
            <dt>Oxirgi aloqa</dt><dd>${esc(d.last_seen || "hech qachon")} (UTC)</dd>
          </dl>

      // Yuz tanish faqat ochilganda yuklanadi — har mijoz sahifasida

    // ── Sozlamalar ─────────────────────────────────────────────────────
    async function renderSettings(el) {

      const missing = items.filter((i) => !i.ok);
      const ready = items.filter((i) => i.ok);
      const alerts = S.alerts || {};
      const p = S.providers || {};
      const catalog = S.catalog || {};
      const updatesPaused = Boolean((S.updates || {}).paused);
      const features = catalog.features || [];
      const book = catalog.price_book || {};

      const missingRows = missing.length
        ? missing.map((i) => `<div class="member-row">

      const priceRows = features.length
        ? `<div class="scroll-x"><table class="events">
            <thead><tr><th>Imkoniyat</th><th>Turi</th><th>Narx</th></tr></thead>

              <td><b>${esc(f.name)}</b></td>

              <td>$${(Number(f.monthly_usd_cents) / 100).toFixed(0)} / kamera</td>

        : `<p class="hint">Narx jadvali bo'sh.</p>`;

      el.innerHTML = `
        <h1>Sozlamalar</h1>
        <section class="card">
          <div class="card-head"><h2>Tizim tayyorligi</h2>
            <span class="hint">${ready.length}/${items.length} tayyor</span></div>
          ${missingRows}
          ${ready.length ? `<details style="margin-top: 12px"><summary><b>${ready.length} ta tayyor qism</b></summary>

    // ── Amallar: bitta jadval, 29 ta `if` o'rniga ──────────────────────
    const ACTIONS = {

      "refresh": async () => {
        const { section } = currentRoute();
        invalidate(...section.deps);
        await renderCurrent();
        notify("Yangilandi");

      "logout": () => {
        sessionStorage.removeItem(KEY_STORAGE);

      // Faqat ro'yxat qayta chiziladi — qidiruv maydonidagi fokus saqlanadi.
      "cust-filter": (el) => {
        custFilter = el.dataset.id;

      "updates-toggle": async (el) => {
        const paused = el.dataset.to === "1";
        const ok = await confirmDialog({
          title: paused ? "Yangilanishni to'xtatish" : "Yangilanishni qayta yoqish",

          confirmLabel: paused ? "To'xtatish" : "Yoqish",
          danger: paused,

        await api("/api/v1/admin/updates-paused", {
          method: "PUT", body: JSON.stringify({ paused }),
        });
        notify(paused ? "Yangilanish to'xtatildi" : "Yangilanish yoqildi");
        await reload("updates");
      },
      "alert-test": async () => {
        await api("/api/v1/admin/alerts/test", { method: "POST" });

      "lead-convert": (el) => askConvertLead(el.dataset.id),
      "account-status": (el) => setAccountStatus(el.dataset.id, el.dataset.to),
      "account-password": (el) => askPassword(el.dataset.id),
      "face-add": (el) => askFaceEmployee(el.dataset.id),

    // ── Obuna ──────────────────────────────────────────────────────────
    const MONTH_CHIPS = [1, 3, 6, 12];
    function monthPicker(defaultValue = 1) {
      return `
        <div class="chip-row" style="margin-bottom: 10px">
          ${MONTH_CHIPS.map((m) => `<button class="chip${m === defaultValue ? " active" : ""}" type="button"
            data-months="${m}">${m} oy</button>`).join("")}
        </div>
        <label class="field">Yoki boshqa son<input type="number" data-months-input min="1" max="60" value="${defaultValue}" /></label>`;
    }
    function wireMonthPicker(form, onChange) {
      const input = form.querySelector("[data-months-input]");
      form.querySelectorAll("[data-months]").forEach((chip) => {
        chip.addEventListener("click", () => {
          form.querySelectorAll("[data-months]").forEach((c) => c.classList.remove("active"));
          chip.classList.add("active");
          input.value = chip.dataset.months;
          if (onChange) onChange(Number(input.value));
        });
      });
      input.addEventListener("input", () => {
        form.querySelectorAll("[data-months]").forEach((c) => c.classList.toggle("active", c.dataset.months === input.value));
        if (onChange) onChange(Number(input.value));
      });
      return () => {
        const n = Number(input.value);
        if (!Number.isInteger(n) || n < 1 || n > 60) throw new Error("1 dan 60 gacha oy kiriting");
        return n;
      };
    }

    async function askExtend(siteId) {
      const site = siteById(siteId);
      let readMonths;
      await openModal({
        title: "To'lovsiz uzaytirish",
        html: `<p class="hint" style="margin: 0 0 12px">${esc(site ? site.name : "Mijoz")} obunasi hisob ochmasdan uzayadi.</p>
               ${monthPicker(1)}<p class="hint" data-preview></p>`,
        submitLabel: "Uzaytirish",
        onReady: (form) => {
          readMonths = wireMonthPicker(form, (n) => {
            const base = site && site.subscription_until ? new Date(site.subscription_until) : new Date();
            const next = new Date(base.getTime());
            next.setMonth(next.getMonth() + (Number.isInteger(n) ? n : 0));
            form.querySelector("[data-preview]").textContent =
              Number.isInteger(n) && n > 0 ? `Yangi tugash sanasi: ${next.toISOString().slice(0, 10)}` : "";
          });
        },
        onSubmit: async () => {
          const res = await api(`/api/v1/admin/sites/${encodeURIComponent(siteId)}/extend`, {
            method: "POST", body: JSON.stringify({ months: readMonths() }),
          });
          notify(`Obuna ${day(res.subscription_until)} gacha uzaytirildi`);
          await reload("sites", "stats");
        },
      });
    }

        : await confirmDialog({ title: "Qayta yoqish", text: `«${name}» obunasi qayta yoqilsinmi?`, confirmLabel: "Yoqish" });

      await api(`/api/v1/admin/sites/${encodeURIComponent(siteId)}/status`, {

    async function askCamera(siteId) {

    function randomPassword() {
      const alphabet = "abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      const bytes = crypto.getRandomValues(new Uint32Array(14));
      return [...bytes].map((n) => alphabet[n % alphabet.length]).join("");
    }

    // Do'kon egasiga parol TELEFONDA aytiladi — SMS shlyuzi yo'q.
    // `k7Qm2xW9pL` ni telefonda aytib bo'lmaydi, "olma anor 4821" ni esa
    // bo'ladi.  Server ham aynan shu shaklda yaratadi.
    const PASSWORD_WORDS = ["olma", "anor", "uzum", "bodom", "shakar", "asal",
      "chinor", "lola", "qaymoq", "gilos", "nok", "shaftoli", "behi", "tut", "anjir"];
    function readablePassword() {
      const pick = () => PASSWORD_WORDS[crypto.getRandomValues(new Uint32Array(1))[0] % PASSWORD_WORDS.length];
      let first = pick(), second = pick();
      while (second === first) second = pick();
      const digits = 1000 + (crypto.getRandomValues(new Uint32Array(1))[0] % 9000);
      return `${first}${second}${digits}`;
    }

    async function openFeatures(siteId) {
      await need(["catalog", "templates"]);
      const id = encodeURIComponent(siteId);
      const [summary, site] = await Promise.all([
        api(`/api/v1/admin/sites/${id}/features`),
        api(`/api/v1/admin/sites/${id}`),
      ]);
      const features = (S.catalog && S.catalog.features) || [];
      const templates = S.templates || [];
      const selected = summary.drafts.length ? summary.drafts : summary.assignments.filter((x) => x.status === "active");
      const byCode = Object.fromEntries(selected.map((item) => [item.feature_code, item]));
      // Narx hali hisoblanmagan bo'lishi mumkin — oyna shu sababdan
      // yiqilmasligi kerak.
      const quote = summary.active_quote || { monthly_usd_cents: 0, monthly_uzs: 0 };

      const rows = features.map((f) => {
        const current = byCode[f.code];
        return `<label class="choice">
          <input type="checkbox" data-feature-code="${esc(f.code)}" ${current ? "checked" : ""} />
          <span><b>${esc(f.name)}</b>
            <small>${f.queue_kind === "realtime" ? "Tezkor xabar" : "Kunlik tahlil"}
              · $${(Number(f.monthly_usd_cents) / 100).toFixed(0)} har kamera uchun</small></span>
          <input type="number" aria-label="${esc(f.name)} uchun kamera soni" data-feature-count="${esc(f.code)}"
            min="1" max="8" value="${current ? esc(current.camera_count) : 1}" style="width: 70px; margin-left: auto" />
        </label>`;
      }).join("");

      await openModal({
        title: `${site.name} — AI imkoniyatlar`,
        wide: true,
        html: `
          <p class="hint" style="margin: 0 0 12px">Har do'kon uchun $20 baza + tanlangan imkoniyat × kamera soni.</p>
          <label class="field">Tayyor to'plam
            <select data-template><option value="">Qo'lda tanlash</option>
              ${templates.map((t) => `<option value="${esc(t.code)}">${esc(t.name)}</option>`).join("")}</select></label>
          ${rows || '<p class="hint">Katalog bo\'sh.</p>'}
          <div class="note ok" data-quote>Hozirgi oylik: $${(Number(quote.monthly_usd_cents) / 100).toFixed(0)} ≈ ${uzs(quote.monthly_uzs)}</div>
          <div class="action-row">
            <button class="button ghost" type="button" data-act-save>Qoralama sifatida saqlash</button>
            <button class="button primary" type="button" data-act-approve>Tasdiqlash va yoqish</button>
          </div>`,
        onReady: (form) => {
          const quoteBox = form.querySelector("[data-quote]");
          const read = () => [...form.querySelectorAll("[data-feature-code]")]
            .filter((i) => i.checked)
            .map((i) => ({
              feature_code: i.dataset.featureCode,
              camera_count: Number(form.querySelector(`[data-feature-count="${CSS.escape(i.dataset.featureCode)}"]`).value),
            }));

          // Narx har belgilaganda darrov yangilanadi — tasdiqlashdan oldin
          // "qancha bo'ladi?" degan savol qolmaydi.
          let timer = null;
          const preview = () => {
            clearTimeout(timer);
            timer = setTimeout(async () => {
              const selections = read();
              if (!selections.length) {
                quoteBox.className = "note warn";
                quoteBox.textContent = "Hech narsa tanlanmagan.";
                return;
              }
              try {
                const q = await api(`/api/v1/admin/sites/${id}/features/quote`, {
                  method: "POST", body: JSON.stringify({ selections }),
                });
                quoteBox.className = "note ok";
                quoteBox.textContent = `Yangi oylik: $${(q.monthly_usd_cents / 100).toFixed(0)} ≈ ${uzs(q.monthly_uzs)}`
                  + ` (hozir: $${(Number(quote.monthly_usd_cents) / 100).toFixed(0)})`;
              } catch (err) {
                quoteBox.className = "note err";
                quoteBox.textContent = err.message;
              }
            }, 250);
          };
          form.addEventListener("input", preview);

          form.querySelector("[data-template]").addEventListener("change", (e) => {
            const template = templates.find((t) => t.code === e.target.value);
            if (!template) return;
            form.querySelectorAll("[data-feature-code]").forEach((input) => {
              input.checked = template.feature_codes.includes(input.dataset.featureCode);
            });
            preview();
          });

          form.querySelector("[data-act-save]").addEventListener("click", async () => {
            const selections = read();
            if (!selections.length) return notify("Kamida bitta imkoniyat tanlang", false);
            try {
              await api(`/api/v1/admin/sites/${id}/features/draft`, { method: "PUT", body: JSON.stringify({ selections }) });
              notify("Qoralama saqlandi — tasdiqlashni kutmoqda");
            } catch (err) { notify(err.message, false); }
          });

          form.querySelector("[data-act-approve]").addEventListener("click", async () => {
            const ok = await confirmDialog({
              title: "Tasdiqlash",
              text: "Tanlangan imkoniyatlar yoqiladi va do'kon kompyuteri yangi sozlamani oladi. Yangi oylik summa hisobga olinadi.",
              confirmLabel: "Yoqish",
            });
            if (!ok) return;
            try {
              const result = await api(`/api/v1/admin/sites/${id}/features/approve`, { method: "POST" });
              notify(`Yoqildi. Yangi oylik: $${(result.active_quote.monthly_usd_cents / 100).toFixed(0)}`);
              closeModal();
              await reload("sites", "stats");
            } catch (err) { notify(err.message, false); }
          });
        },
      });
    }

    let faceBlobUrls = [];

    async function loadAuthedImage(url, img) {
      try {
        const res = await fetch(url, { headers: authHeaders() });
        if (!res.ok) return;
        const blobUrl = URL.createObjectURL(await res.blob());
        faceBlobUrls.push(blobUrl);
        img.src = blobUrl;
      } catch (_) {}
    }

    async function loadFaces(siteId, host) {
      faceBlobUrls.forEach((u) => URL.revokeObjectURL(u));
      faceBlobUrls = [];
      const id = encodeURIComponent(siteId);
      try {
        const data = await api(`/api/v1/admin/sites/${id}/faces`);
        const service = data.service.ok
          ? `<div class="note ok"><b>Xizmat tayyor</b>Moslik chegarasi: ${esc(data.threshold)}</div>`
          : `<div class="note warn"><b>Xizmat ishlamayapti</b>${esc(data.service.reason)}</div>`;
        const cards = data.employees.map((emp) => `
          <div class="face-card${emp.active ? "" : " off"}">
            <div class="who"><b>${esc(emp.name)}</b>
              <small>${emp.active ? (emp.enrollment_status === "enrolled" ? "ro'yxatda" : "rasm kutilmoqda") : "faol emas"}
                · rozilik: ${day(emp.consent_recorded_at)}</small></div>
            <div class="face-photos">${emp.photos.map((p) => `
              <span class="face-photo">
                <img class="face-thumb" data-face-img="/api/v1/admin/sites/${esc(siteId)}/faces/photos/${esc(p.id)}/image" alt="" />
                <button class="button danger small" type="button" data-act="face-delete"

              </span>`).join("") || '<span class="hint">rasm yo\'q</span>'}</div>
            <div class="action-row" style="margin-top: 0">
              <input type="file" accept="image/jpeg,image/png" id="facePhoto-${esc(emp.id)}" />
              <button class="button ghost small" type="button" data-act="face-upload"
                data-id="${esc(siteId)}" data-for="${esc(emp.id)}">Rasm yuklash</button>
            </div>
          </div>`).join("");

        host.innerHTML = `
          ${service}
          <p class="hint">Yopiq pilot: har xodimdan <b>yozma rozilik</b> olinadi, 1–3 aniq yuzli rasm yuklanadi.
            Rasm shifrlangan namunaga aylanadi, davomat kadrlari 14 kundan keyin o'chadi.</p>

          <div class="action-row">
            <button class="button primary" type="button" data-act="face-add" data-id="${esc(siteId)}">Xodim qo'shish</button>
          </div>
          <div data-face-events style="margin-top: 18px"></div>`;

        loadFaceEvents(siteId, host.querySelector("[data-face-events]"));
      } catch (err) {
        host.innerHTML = `<div class="note err"><b>Ma'lumot kelmadi</b>${esc(err.message)}</div>`;
      }
    }

          const target = facesHost();
          if (target) await loadFaces(target.id, target.host);
        },
      });
    }

    async function uploadFacePhoto(siteId, employeeId) {
      const input = $(`facePhoto-${employeeId}`);
      const file = input && input.files && input.files[0];
      if (!file) return notify("Avval rasm faylini tanlang", false);
      await api(`/api/v1/admin/sites/${encodeURIComponent(siteId)}/faces/employees/${encodeURIComponent(employeeId)}/photos`, {
        method: "POST", headers: { "Content-Type": "image/jpeg" }, body: file,
      });
      notify("Rasm qabul qilindi — yuz namunasi saqlandi");
      const target = facesHost();
      if (target) await loadFaces(target.id, target.host);
    }

    async function askDeleteFacePhoto(faceId, siteId) {
      const ok = await confirmDialog({
        title: "Rasmni o'chirish",
        text: "Bu rasm va undan olingan yuz namunasi butunlay o'chiriladi.",
        confirmLabel: "O'chirish", danger: true,
      });
      if (!ok) return;
      await api(`/api/v1/admin/sites/${encodeURIComponent(siteId)}/faces/photos/${encodeURIComponent(faceId)}`, { method: "DELETE" });
      notify("O'chirildi");
      const target = facesHost();
      if (target) await loadFaces(target.id, target.host);
    }

    // ── Kirish ─────────────────────────────────────────────────────────
    async function showApp() {
      $("login").classList.add("hidden");
      $("app").classList.remove("hidden");
      if (!location.hash) location.hash = "#/boshqaruv";
      await renderCurrent();
    }

    $("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const err = $("loginError");
      err.classList.add("hidden");
      adminKey = $("adminKey").value.trim();
      try {
        if (!adminKey) {
          const response = await fetch("/api/v1/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username: $("adminUsername").value.trim(), password: $("adminPassword").value }),
          });
          const data = await response.json();
          if (!response.ok) throw new Error(data.detail || "Login yoki parol noto'g'ri");
          if (data.account.role !== "admin") throw new Error("Bu login admin emas");
          adminToken = data.access_token;
          sessionStorage.setItem(KEY_STORAGE, adminToken);
          sessionStorage.removeItem(LEGACY_KEY_STORAGE);
        } else {
          sessionStorage.setItem(LEGACY_KEY_STORAGE, adminKey);
          sessionStorage.removeItem(KEY_STORAGE);
        }
        await api("/api/v1/admin/stats");
        await showApp();
      } catch (error) {
        err.textContent = error.message;
        err.classList.remove("hidden");
      }
    });

    // ── Ishga tushirish ────────────────────────────────────────────────
    (async () => {
      if (!adminKey && !adminToken) return;
      try {
        await api("/api/v1/admin/stats");
        await showApp();
      } catch (_) {
        sessionStorage.removeItem(KEY_STORAGE);
        sessionStorage.removeItem(LEGACY_KEY_STORAGE);
        adminKey = "";
        adminToken = "";
      }
    })();
  </script>
</body>
</html>
