<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Chaqimchi AI — yuklab olish</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #faf7f2; color: #1f2937; display: grid; min-height: 100vh; place-items: center; }
    .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 16px; padding: 32px; max-width: 460px; width: calc(100% - 48px); box-shadow: 0 10px 30px rgba(0,0,0,.06); }
    h1 { font-size: 1.3rem; margin: 0 0 6px; }
    p { margin: 8px 0; font-size: .92rem; color: #4b5563; }
    .btn { display: inline-block; margin-top: 14px; background: #111827; color: #fff; text-decoration: none; padding: 12px 22px; border-radius: 10px; font-weight: 600; }
    .meta { font-size: .8rem; color: #6b7280; margin-top: 10px; }
    code { background: #f3f4f6; padding: 2px 6px; border-radius: 6px; font-size: .78rem; word-break: break-all; }
    a.plain { color: #2563eb; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Chaqimchi AI — Windows dasturi</h1>
    <p>Do'kon kompyuteriga o'rnatiladi: yuklab oling, «Keyingi → Keyingi → Tayyor», so'ng brauzerda kamerani ulaysiz.</p>
    <a class="btn" id="dlBtn" href="/api/v1/public/download-installer?os=windows">Yuklab olish</a>
    <p class="meta" id="dlMeta">Versiya aniqlanmoqda…</p>
    <p class="meta">O'rnatish yo'riqnomasi: <a class="plain" href="https://docs.chaqimchi.uz/ornatish-windows">docs.chaqimchi.uz</a></p>
  </div>
  <script>
    fetch("/api/v1/public/windows-release").then((r) => r.ok ? r.json() : null).then((d) => {
      const meta = document.getElementById("dlMeta");
      if (d && d.available) {
        meta.textContent = `Versiya ${d.version} · ${d.size_mb} MB · imzolangan`;
      } else {
        meta.textContent = "Reliz hozircha tayyorlanmoqda.";
        document.getElementById("dlBtn").style.opacity = ".5";
      }
    }).catch(() => {});
  </script>
</body>
</html>
