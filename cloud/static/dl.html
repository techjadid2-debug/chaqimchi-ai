<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Chaqimchi AI — yuklab olish</title>
  <link rel="icon" href="/assets/favicon.png" type="image/png">
  <link rel="stylesheet" href="/assets/site.css?v=d4e6045b1a">
  <!-- Sahifa `site.css` tokenlariga tayanadi; bu yerda faqat markazga
       joylashtirilgan bitta kartaning qolipi. -->
  <style>
    :root { color-scheme: light; }
    body { display: grid; min-height: 100vh; place-items: center; background: var(--paper-2); }
    .card { width: calc(100% - 48px); max-width: 470px; padding: 32px; border: 1px solid var(--border); border-radius: var(--radius); background: #fff; box-shadow: var(--shadow); }
    .card .brand { margin-bottom: 20px; }
    .card h1 { margin: 0 0 8px; font-size: 22px; }
    .card p { margin: 8px 0; color: var(--muted); font-size: 15px; }
    .meta { margin-top: 12px; font-size: 13px; }
    .plain { color: var(--blue-dark); }
  </style>
</head>
<body>
  <div class="card">
    <a class="brand" href="/">
      <span class="brand-mark"><img src="/assets/chaqimchi-logo-new.png" alt=""></span>
      <span>Chaqimchi <b>AI</b></span>
    </a>
    <h1>Windows dasturi</h1>
    <p>Do'kon kompyuteriga o'rnatiladi: yuklab oling, «Keyingi → Keyingi → Tayyor», so'ng brauzerda kamerani ulaysiz.</p>
    <a class="button button-light" id="dlBtn" href="/api/v1/public/download-installer?os=windows">Yuklab olish</a>
    <p class="meta hint" id="dlMeta">Versiya aniqlanmoqda…</p>
    <p class="meta hint">O'rnatish yo'riqnomasi: <a class="plain" href="https://docs.chaqimchi.uz/ornatish-windows">docs.chaqimchi.uz</a></p>
  </div>
  <script>
    fetch("/api/v1/public/windows-release").then((r) => r.ok ? r.json() : null).then((d) => {
      const meta = document.getElementById("dlMeta");
      if (d && d.available) {
        meta.textContent = `Versiya ${d.version} · ${d.size_mb} MB · imzolangan`;
      } else {
        meta.textContent = "Reliz hozircha tayyorlanmoqda.";
        document.getElementById("dlBtn").style.opacity = ".5";
      }
    }).catch(() => {});
  </script>
</body>
</html>
