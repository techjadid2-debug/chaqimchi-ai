<!doctype html>
<!-- AVTOMATIK YASALGAN — QO'LDA TAHRIRLAMANG.
     Manba: cloud/site/dl.html + i18n/ru.json
     Yangilash: python scripts/build_site.py -->
<html lang="ru" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>ENES Monitoring — скачать</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/assets/favicon.png" type="image/png">
  <link rel="stylesheet" href="/assets/site.css?v=c63ef40f91">
  <!-- Sahifa `dl.` subdomenida o'zi turadi (host-based): nav va footer
       yo'q, bitta karta.  Til tanlagich shu hostning `/ru/`, `/en/`
       yo'llariga olib boradi. -->
  <style>
    body { display: grid; min-height: 100vh; place-items: center; background: var(--surface-inset); }
    .card { width: calc(100% - 48px); max-width: 470px; padding: 32px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); }
    .card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
    .card h1 { margin: 0 0 8px; font-size: 22px; }
    .card p { margin: 8px 0; color: var(--muted); font-size: 15px; }
    .meta { margin-top: 12px; font-size: 13px; }
    .plain { color: var(--accent-ink); }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-head">
      <a class="brand brand-lockup" href="/ru/">
        <!-- ENES Monitoring — "NS" monogrammasi.
     Rang ATAYLAB `currentColor`: belgi yorug' temada to'q, qorong'ida
     oq bo'lishi kerak va buni CSS hal qiladi — ikkita fayl saqlash
     shart emas. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 68 56" fill="none" role="img" aria-label="ENES">
  <g stroke="currentColor" stroke-width="7" stroke-linejoin="round">
    <path d="M8 44V12l19 30V12"/>
    <path d="M60 16H44l-6 10h16l-6 12H31"/>
  </g>
</svg>
        <span class="brand-text"><b>ENES</b><small>Monitoring</small></span>
      </a>
      <details class="lang-menu"><summary aria-label="Язык"><span>RU</span></summary><div class="lang-menu-list"><a href="/" hreflang="uz" lang="uz">O‘zbekcha</a><a href="/ru/" hreflang="ru" lang="ru" aria-current="true">Русский</a><a href="/en/" hreflang="en" lang="en">English</a></div></details>
    </div>
    <h1>Программа для Windows</h1>
    <p>Ставится на компьютер магазина: скачайте, «Далее → Далее → Готово», затем подключите камеры в браузере.</p>
    <a class="button button-light" id="dlBtn" href="/api/v1/public/download-installer?os=windows">Скачать</a>
    <p class="meta hint" id="dlMeta">Определяем версию…</p>
    <p class="meta hint">Инструкция по установке: <a class="plain" href="/install">пошагово</a></p>
  </div>
  <script>
    const TEXT = { version: "Версия {version} · {size} МБ · подписано", pending: "Релиз ещё готовится." };
    fetch("/api/v1/public/windows-release").then((r) => r.ok ? r.json() : null).then((d) => {
      const meta = document.getElementById("dlMeta");
      if (d && d.available) {
        meta.textContent = TEXT.version.replace("{version}", d.version).replace("{size}", d.size_mb);
      } else {
        meta.textContent = TEXT.pending;
        document.getElementById("dlBtn").style.opacity = ".5";
      }
    }).catch(() => {});
  </script>
</body>
</html>
