<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!--
    Chaqimchi AI ikonkalari — bitta sprite.
    Ishlatish:  <svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#kamera"/></svg>

    Uslub v2 panel (`frontend/src/icons.tsx`) bilan AYNAN bir xil:
    24×24 koordinata, `fill="none"`, `stroke="currentColor"`, qalinlik
    1.8, uchlari va burchaklari yumaloq.

    2026-08-24: eski "3D" ikonkalar (gradient, yaltiroq qirra, ellips
    soya) olib tashlandi.  Ular ko'k qilingandan keyin ham dizayndan
    ajralib turardi: sahifadagi qolgan hamma narsa yassi va yupqa
    chiziqli, ikonkalar esa og'ir, yaltiroq predmetlar edi — narx
    kartasida bu ayniqsa ko'zga tashlanardi.

    Rang CSS dan keladi: `.icon` uchun `color` belgilanadi, ikonka esa
    `currentColor` bilan chiziladi.  Shu sabab bu yerda birorta qattiq
    rang YO'Q va ikonka joylashgan kontekstga o'zi moslashadi.

    DIQQAT: bu fayl XML sifatida o'qiladi.  Izoh ichida ikkita ketma-ket
    tire ishlatib bo'lmaydi (masalan CSS o'zgaruvchisi nomini yozib) —
    XML uni izohning tugashi deb biladi va BUTUN sprite yaroqsiz bo'lib
    qoladi.  Xato jimgina o'tadi: brauzer hech qanday xabar bermaydi,
    sahifadagi hamma ikonka shunchaki g'oyib bo'ladi.

    Nega emoji emas: 🪟 Windows'da rangsiz kvadrat, Android'da butunlay
    boshqa shakl, iPhone'da uchinchi xil.  Brend rangini ham bera
    olmaydi.
  -->

  <!-- Kamera — do'konga o'rnatiladigan kuzatuv kamerasi. -->
  <symbol id="kamera" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 9.4 17.6 5l1.4 4.8L4.4 14.2Z"/>
    <circle cx="15.4" cy="8.3" r="1.4"/>
    <path d="M6.4 13.4 4.6 20M2 20h6"/>
  </symbol>

  <!-- Do'kon — soyabon va eshik. -->
  <symbol id="dokon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 10v10h16V10"/>
    <path d="M3 4h18l-1 6H4L3 4Z"/>
    <path d="M9.5 20v-5.5h5V20"/>
  </symbol>

  <!-- Kassa navbati — piket oldida turgan odamlar. -->
  <symbol id="navbat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="6.2" r="2.2"/>
    <path d="M3.6 13.2v-.9C3.6 10.5 5.1 9.4 7 9.4s3.4 1.1 3.4 2.9v.9"/>
    <circle cx="15.2" cy="6.8" r="1.8"/>
    <path d="M12.4 13.2v-.7c0-1.6 1.3-2.5 2.8-2.5s2.8.9 2.8 2.5v.7"/>
    <path d="M2.5 16h19v4.2h-19z"/>
  </symbol>

  <!-- Qalqon — kamera va xavfsizlik nazorati. -->
  <symbol id="qalqon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3 4 6v5c0 5 3.4 8.4 8 10 4.6-1.6 8-5 8-10V6l-8-3Z"/>
    <path d="m9 12 2 2 4-5"/>
  </symbol>

  <!-- Do'kon kompyuteri. -->
  <symbol id="kompyuter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2.5" y="4" width="19" height="12.5" rx="2.5"/>
    <path d="M12 16.5V20M8.5 20h7"/>
  </symbol>

  <!-- Arxiv — saqlanadigan hodisalar qutisi. -->
  <symbol id="quti" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 7.6 12 3.2l9 4.4-9 4.4-9-4.4Z"/>
    <path d="M3 7.6v8.8L12 20.8l9-4.4V7.6"/>
    <path d="M12 12v8.8"/>
  </symbol>

  <!-- Telegram — xabar shu yerga keladi. -->
  <symbol id="telegram" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 4 3 11l5 2 2 6 3-4 5 4 3-15Z"/>
    <path d="m8 13 9-6-6 8"/>
  </symbol>

  <!-- Avtomatik yangilanish — dastur o'zi yuklab oladi. -->
  <symbol id="yuklash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3v11"/>
    <path d="m8 10 4 4 4-4"/>
    <path d="M5 20h14"/>
  </symbol>

  <!-- Soat — kunlik hisobot va soat bo'yicha tahlil. -->
  <symbol id="soat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 7v5.5l3.5 2"/>
  </symbol>

  <!-- Odamlar — kirish-chiqish sanog'i va mijozlar oqimi. -->
  <symbol id="odamlar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="9" cy="8" r="3"/>
    <path d="M3 20v-2c0-3 2.5-5 6-5s6 2 6 5v2"/>
    <path d="M16 5.5a3 3 0 0 1 0 5.8M17 14c2.5.3 4 1.8 4 4v2"/>
  </symbol>

  <!-- Issiqlik xaritasi — gavjum zona do'kon rejasida. -->
  <symbol id="xarita" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2.5" y="4" width="19" height="16" rx="2.5"/>
    <path d="M9 4v4.5M9 15.5V20M2.5 12h4"/>
    <circle cx="15.4" cy="12" r="1.5"/>
    <circle cx="15.4" cy="12" r="4.2"/>
  </symbol>

  <!-- Mijoz portreti — takroriy mijoz kartasi. -->
  <symbol id="portret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2.5" y="4" width="19" height="16" rx="3"/>
    <circle cx="9" cy="10" r="2.2"/>
    <path d="M5.6 16.4c0-1.9 1.5-3.1 3.4-3.1s3.4 1.2 3.4 3.1"/>
    <path d="M15.5 9.5h3.2M15.5 13h3.2"/>
  </symbol>

  <!-- Maktab — ta'lim muassasasi (Chaqimchi Edu). -->
  <symbol id="maktab" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3 3 7.5 12 12l9-4.5L12 3Z"/>
    <path d="M6.5 9.8V15c0 1.9 2.5 3.4 5.5 3.4s5.5-1.5 5.5-3.4V9.8"/>
    <path d="M21 7.5v5.5"/>
  </symbol>

  <!-- Dars — jadval va sinf monitoringi. -->
  <symbol id="kitob" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 4.5h5.5A2.5 2.5 0 0 1 12 7v12a2 2 0 0 0-2-2H4V4.5Z"/>
    <path d="M20 4.5h-5.5A2.5 2.5 0 0 0 12 7v12a2 2 0 0 1 2-2h6V4.5Z"/>
  </symbol>

  <!-- Xodim davomati — yuz bo'yicha tanish. -->
  <symbol id="yuz" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 8.5v-2A2.5 2.5 0 0 1 6.5 4h2M15.5 4h2A2.5 2.5 0 0 1 20 6.5v2M20 15.5v2a2.5 2.5 0 0 1-2.5 2.5h-2M8.5 20h-2A2.5 2.5 0 0 1 4 17.5v-2"/>
    <path d="M9.6 10.6h.01M14.4 10.6h.01"/>
    <path d="M9.6 14.6c1.6 1.3 3.2 1.3 4.8 0"/>
  </symbol>
</svg>
