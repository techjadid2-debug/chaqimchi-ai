<!doctype html>
<html lang="uz">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Tizim holati — Chaqimchi Lite</title><link rel="stylesheet" href="/assets/site.css"></head>
<body class="utility-page">
  <header class="nav-shell"><nav class="nav"><a class="brand" href="/"><span class="brand-mark"><img src="/assets/chaqimchi-logo-black-crop-v1.png" alt=""></span><span>Chaqimchi <b>Lite</b></span></a><a class="text-link" href="/">Bosh sahifa</a></nav></header>
  <main class="utility-main">
    <p class="eyebrow"><span></span> Tizim holati</p><h1>Chaqimchi Cloud</h1>
    <section class="utility-card status-panel"><span id="light" class="status-light"></span><div><h2 id="statusTitle" style="margin-bottom:6px">Tekshirilmoqda…</h2><p id="statusText" style="margin:0;color:var(--muted)">Cloud health endpoint javobi kutilmoqda.</p></div></section>
  </main>
  <script>
    fetch('/health',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error();return r.json()}).then(()=>{document.getElementById('light').classList.add('online');document.getElementById('statusTitle').textContent='Cloud ishlayapti';document.getElementById('statusText').textContent='Rasmiy sayt, admin API va qurilma ulanish endpointi javob bermoqda.'}).catch(()=>{document.getElementById('statusTitle').textContent='Cloud bilan aloqa yo‘q';document.getElementById('statusText').textContent='Servis jamoasi holatni tekshirishi kerak.'});
  </script>
</body>
</html>
