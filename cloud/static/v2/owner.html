<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <!-- Tema BIRINCHI chizishdan oldin qo'yiladi.  React ichida
         qilinsa sahifa bir zumga yorug' ochilib, keyin qorayadi —
         kechasi telefonda bu ko'zni qamashtiradi.  Kalit
         `frontend/src/theme.ts` dagi `THEME_KEY` bilan bir xil. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("enes_theme");
          if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
        } catch (e) { /* xususiy oyna — tizim rejimi qoladi */ }
      })();
    </script>
    <title>Chaqimchi — biznes paneli</title>
    <link rel="icon" href="/assets/favicon.png" type="image/png" />
    <link rel="manifest" href="/assets/v2/manifest.webmanifest" />
    <!-- Telegram Mini App SDK.  Usiz `window.Telegram` hech qachon
         paydo bo'lmaydi va bot ichidan ochilgan panel parol so'rab
         qolardi — hisobda esa parolsiz kirish kutilardi. -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script type="module" crossorigin src="/assets/v2/assets/owner-BudFK-tO.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/v2/assets/styles-BmPon90R.js">
    <link rel="stylesheet" crossorigin href="/assets/v2/assets/styles-ADIpbNfB.css">
  </head>
  <body>
    <div id="root"></div>
    <!-- Bot manzilini server `_render_owner()` da almashtiradi (bot
         sozlanmagan bo'lsa joy bo'sh qoladi va login ekranida
         "botdan havola oling" taklifi ko'rsatilmaydi). -->
    <script>window.__CHAQIMCHI_BOT_URL__ = "__TELEGRAM_BOT_URL__";</script>
  </body>
</html>
