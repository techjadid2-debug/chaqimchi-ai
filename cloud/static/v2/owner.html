<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#11161f" />
    <!-- Tema BIRINCHI chizishdan oldin qo'yiladi.  React ichida
         qilinsa sahifa bir zumga boshqa rangda ochilib, keyin almashadi.
         Standart QORA (`theme.ts` bilan bir xil); «system» saqlangan
         bo'lsa atribut qo'yilmaydi — tokens.css media so'rovi ishlaydi.
         Skript ikkala qobiqda AYNAN bir xil: CSP'da bitta hash
         (`deploy/Caddyfile*`, `tests/test_security_headers.py`). -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("enes_theme");
          if (t === "light") document.documentElement.dataset.theme = "light";
          else if (t !== "system") document.documentElement.dataset.theme = "dark";
        } catch (e) { document.documentElement.dataset.theme = "dark"; }
      })();
    </script>
    <title>ENES Monitoring — biznes paneli</title>
    <link rel="icon" href="/assets/favicon.png" type="image/png" />
    <link rel="manifest" href="/assets/v2/manifest.webmanifest" />
    <!-- Telegram Mini App SDK.  Usiz `window.Telegram` hech qachon
         paydo bo'lmaydi va bot ichidan ochilgan panel parol so'rab
         qolardi — hisobda esa parolsiz kirish kutilardi. -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script type="module" crossorigin src="/assets/v2/assets/owner-CZJgxA_7.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/v2/assets/styles-DOH-tyiv.js">
    <link rel="stylesheet" crossorigin href="/assets/v2/assets/styles-Hk1nqFYe.css">
  </head>
  <body>
    <div id="root"></div>
    <!-- Bot manzilini server `_render_owner()` da almashtiradi (bot
         sozlanmagan bo'lsa joy bo'sh qoladi va login ekranida
         "botdan havola oling" taklifi ko'rsatilmaydi). -->
    <script type="application/json" id="bot-url">"__TELEGRAM_BOT_URL__"</script>
  </body>
</html>
