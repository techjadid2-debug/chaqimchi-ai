# Legacy nom: yangi Orange Pi o'rnatishlari `config/lite.yaml` dan foydalanadi.
environment: production

face:
  model_name: licensed_set1
  model_root: models/insightface
  model_version: licensed-set1-v1
  det_size: [640, 640]
  preprocess_max_side: 1024
  compare_threshold: 0.4
  commercial_model_licensed: false  # env: CHAQIMCHI_FACE_MODEL_LICENSED=true

camera:
  frame_skip: 5

license:
  enabled: true
  cloud_url: "${CHAQIMCHI_CLOUD_URL}"
  site_id: "${CHAQIMCHI_SITE_ID}"
  device_token: "${CHAQIMCHI_DEVICE_TOKEN}"
  heartbeat_interval_sec: 300
  offline_grace_days: 7

cloud_sync:
  enabled: true
  url: "${CHAQIMCHI_CLOUD_URL}"
  site_id: "${CHAQIMCHI_SITE_ID}"
  device_id: "${CHAQIMCHI_DEVICE_ID}"
  device_token: "${CHAQIMCHI_DEVICE_TOKEN}"
  interval_sec: 5
  heartbeat_interval_sec: 60
  batch_size: 50
  queue_days: 7
  queue_max_bytes: 21474836480

paths:
  db_path: data/database
  events_db: data/events.db
  snapshots_dir: data/snapshots
  calibration_dir: data/calibration
  audit_db: data/audit.db

events:
  match_debounce_sec: 30
  save_snapshots: true
  retention_days: 30
  retention_interval_sec: 21600

tracking:
  enabled: true
  iou_threshold: 0.30
  max_missed_frames: 15

scene:
  enabled: true
  backend: onnx  # RK3588 benchmarkdan keyin rknn
  model_path: models/person_detector.onnx
  confidence: 0.45
  nms_threshold: 0.45
  input_size: 640
  analyze_fps: 2
  burst_fps: 5
  motion_min_area_ratio: 0.01
  loitering_sec: 60
  occupancy_limit: 20
  event_debounce_sec: 30
  zones: []  # Site surveyda normalized polygonlar yoziladi.

security:
  api_key_enabled: true
  jwt:
    enabled: true
    expire_hours: 12

rate_limit:
  enabled: true
  requests_per_minute: 120

storage:
  encrypt_embeddings: true
  vector_backend: numpy

antispoof:
  enabled: false
  backend: onnx
  min_score: 0.5
  min_blur_variance: 80

vision:
  enabled: false

server:
  host: 127.0.0.1
  port: 8742
  cors_origins: []

telegram:
  enabled: false  # owner alertlari cloud botdan keladi

cameras:
  - {id: camera-01, source: "${CAMERA_01_RTSP}", enabled: true}
  - {id: camera-02, source: "${CAMERA_02_RTSP}", enabled: true}
  - {id: camera-03, source: "${CAMERA_03_RTSP}", enabled: true}
  - {id: camera-04, source: "${CAMERA_04_RTSP}", enabled: true}
  - {id: camera-05, source: "${CAMERA_05_RTSP}", enabled: true}
  - {id: camera-06, source: "${CAMERA_06_RTSP}", enabled: true}
  - {id: camera-07, source: "${CAMERA_07_RTSP}", enabled: true}
  - {id: camera-08, source: "${CAMERA_08_RTSP}", enabled: true}
