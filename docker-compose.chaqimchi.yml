# chaqimchi.uz subdomen platformasi uchun compose — prod.yml'ning
# nusxasi, farqi bitta: Caddy subdomenli Caddyfile.chaqimchi bilan
# ishlaydi (hostlar faylda qat'iy, CHAQIMCHI_DOMAIN kerak emas).
# Ishlatish: CHAQIMCHI_COMPOSE_FILE=docker-compose.chaqimchi.yml ./scripts/deploy_cloud.sh
name: chaqimchi

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile.chaqimchi:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      cloud:
        condition: service_healthy
    networks: [frontend]

  cloud:
    build:
      context: .
      dockerfile: Dockerfile.cloud
    restart: unless-stopped
    stop_grace_period: 30s
    env_file: ${CHAQIMCHI_ENV_FILE:-.env.production}
    environment:
      CHAQIMCHI_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CHAQIMCHI_S3_ENDPOINT: http://minio:9000
    volumes:
      - cloud_state:/app/data/cloud
      # Reliz arxivlari va imzolangan manifestlar. Bind mount, image ichida
      # emas (`.dockerignore` da `releases/` bor va shunday qolishi kerak):
      # aks holda har build bilan eskirgan nusxa tarqalardi.
      # Bu qatorsiz `/releases/*.tar.gz` ham, `/downloads/sotqin-installer.sh`
      # ham 404/503 beradi — ya'ni bir buyruqli o'rnatish umuman ishlamaydi.
      - ./releases:/app/releases:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks: [frontend, backend]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    pids_limit: 256
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "5"}

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: ${CHAQIMCHI_ENV_FILE:-.env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "5"}

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    restart: unless-stopped
    env_file: ${CHAQIMCHI_ENV_FILE:-.env.production}
    command: server /data --console-address :9001
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "5"}

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    env_file: ${CHAQIMCHI_ENV_FILE:-.env.production}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 2; done;
        mc mb --ignore-existing "local/$${CHAQIMCHI_S3_BUCKET}";
        mc anonymous set none "local/$${CHAQIMCHI_S3_BUCKET}"
    depends_on:
      minio:
        condition: service_healthy
    networks: [backend]

volumes:
  postgres_data:
  minio_data:
  cloud_state:
  caddy_data:
  caddy_config:

networks:
  frontend:
  backend:
    internal: true
