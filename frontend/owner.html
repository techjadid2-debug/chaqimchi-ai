<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <!-- Tema BIRINCHI chizishdan oldin qo'yiladi.  React ichida
         qilinsa sahifa bir zumga yorug' ochilib, keyin qorayadi —
         kechasi telefonda bu ko'zni qamashtiradi.  Kalit
         `frontend/src/theme.ts` dagi `THEME_KEY` bilan bir xil. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("enes_theme");
          if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
        } catch (e) { /* xususiy oyna — tizim rejimi qoladi */ }
      })();
    </script>
    <title>ENES Monitoring — biznes paneli</title>
    <link rel="icon" href="/assets/favicon.png" type="image/png" />
    <link rel="manifest" href="/assets/v2/manifest.webmanifest" />
    <!-- Telegram Mini App SDK.  Usiz `window.Telegram` hech qachon
         paydo bo'lmaydi va bot ichidan ochilgan panel parol so'rab
         qolardi — hisobda esa parolsiz kirish kutilardi. -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Bot manzilini server `_render_owner()` da almashtiradi (bot
         sozlanmagan bo'lsa joy bo'sh qoladi va login ekranida
         "botdan havola oling" taklifi ko'rsatilmaydi). -->
    <script>window.__ENES_BOT_URL__ = "__TELEGRAM_BOT_URL__";</script>
    <script type="module" src="/src/owner.tsx"></script>
  </body>
</html>
