<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chaqimchi AI — Server Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/modern.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="dashboard">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <i data-lucide="shield-check"></i>
        Chaqimchi AI <span style="font-size: 0.75rem; opacity: 0.5; margin-left: 0.5rem;">Server Edition</span>
      </div>
      <div id="serverStatus" class="status-badge">
        <div class="status-dot"></div>
        Server yuklanmoqda...
      </div>
    </header>

    <!-- Main View: Stats & Activity -->
    <main class="main-view">
      <div class="card" style="padding: 1.5rem;">
        <div class="card-title"><i data-lucide="layout-grid"></i> Tizim holati</div>
        <div class="metrics-grid" style="grid-template-columns: repeat(3, 1fr);">
          <div class="metric-item">
            <div id="camCount" class="metric-value">0</div>
            <div class="metric-label">Faol kameralar</div>
          </div>
          <div id="statUnique" class="metric-item">
            <div class="metric-value">0</div>
            <div class="metric-label">Bugungi noyob tashriflar</div>
          </div>
          <div id="statTotal" class="metric-item">
            <div class="metric-value">0</div>
            <div class="metric-label">Bugungi jami aniqlashlar</div>
          </div>
        </div>
      </div>

      <div class="card" style="flex: 1; display: flex; flex-direction: column;">
        <div class="card-title" style="justify-content: space-between;">
          <span><i data-lucide="list"></i> Oxirgi voqealar (SQL)</span>
          <button onclick="loadRecentEvents()" class="btn btn-secondary" style="padding: 4px 8px; font-size: 0.75rem;">
            <i data-lucide="refresh-cw" style="width: 12px;"></i> Yangilash
          </button>
        </div>
        <div id="eventsTable" class="history-list" style="max-height: none; flex: 1;">
          <!-- SQL Events will be loaded here -->
        </div>
        <p id="retentionNote" style="font-size: 0.7rem; color: var(--text-secondary); margin: 0.5rem 0 0; display: none;"></p>
      </div>
    </main>

    <!-- Sidebar: Management -->
    <aside class="sidebar">
      <div class="card">
        <div class="card-title"><i data-lucide="user-plus"></i> Boshqaruv</div>
        <button id="btnRegister" class="btn btn-primary" style="width: 100%;">
          <i data-lucide="user-plus"></i> Yangi shaxs qo'shish
        </button>
        <button id="btnCalibrate" class="btn btn-secondary" style="width: 100%; margin-top: 0.5rem;">
          <i data-lucide="sliders-horizontal"></i> Threshold kalibrlash
        </button>
        <button id="btnBackup" class="btn btn-secondary" style="width: 100%; margin-top: 0.5rem;">
          <i data-lucide="download"></i> Zaxira nusxa olish
        </button>
        <button id="btnApiKey" class="btn btn-secondary" style="width: 100%; margin-top: 0.5rem; display: none;">
          <i data-lucide="key"></i> API kalit
        </button>
        <p style="font-size: 0.75rem; color: var(--text-secondary); text-align: center;">
          Yangi shaxsni rasm orqali bazaga qo'shing
        </p>
      </div>

      <div class="card" style="flex: 1;">
        <div class="card-title"><i data-lucide="users"></i> Ma'lumotlar bazasi</div>
        <div id="personList" class="history-list">
          <!-- Person list will be loaded here -->
        </div>
      </div>
    </aside>
  </div>

  <script>
    lucide.createIcons();

    const serverStatus = document.getElementById('serverStatus');
    const camCount = document.getElementById('camCount');
    const statUnique = document.querySelector('#statUnique .metric-value');
    const statTotal = document.querySelector('#statTotal .metric-value');
    const eventsTable = document.getElementById('eventsTable');
    const personList = document.getElementById('personList');
    const btnRegister = document.getElementById('btnRegister');
    const btnCalibrate = document.getElementById('btnCalibrate');
    const btnApiKey = document.getElementById('btnApiKey');
    const btnBackup = document.getElementById('btnBackup');

    function apiHeaders(extra = {}) {
      const key = sessionStorage.getItem('chaqimchi_api_key');
      const h = { ...extra };
      if (key) h['X-API-Key'] = key;
      return h;
    }

    async function refreshData() {
      try {
        const [h, s, p] = await Promise.all([
          fetch('/health').then(r => r.json()),
          fetch('/api/stats').then(r => r.json()),
          fetch('/api/persons').then(r => r.json())
        ]);

        if (h.ok) {
          serverStatus.innerHTML = `<i data-lucide="check-circle" style="color: var(--accent-green); width: 16px;"></i> Server Online`;
          serverStatus.style.color = 'var(--accent-green)';
          camCount.textContent = h.cameras_active;
          btnApiKey.style.display = h.api_key_required ? 'inline-flex' : 'none';
        }
        
        statUnique.textContent = s.unique_today;
        statTotal.textContent = s.total_today;

        // Persons
        personList.innerHTML = p.map(per => `
          <div class="history-item">
            <div class="avatar" style="width: 32px; height: 32px; font-size: 0.75rem;">${per.name[0]}</div>
            <div class="item-info">
              <div class="item-name">${per.name}</div>
              <div class="item-meta">ID: ${per.id}</div>
            </div>
            <button type="button" class="btn btn-secondary" style="padding:4px 8px;font-size:0.7rem;"
              onclick="deletePerson('${per.id}', ${JSON.stringify(per.name)})" title="O'chirish">
              <i data-lucide="trash-2" style="width:14px"></i>
            </button>
          </div>
        `).join('') || '<p style="text-align:center; font-size:0.8rem; opacity:0.5;">Baza bo\'sh</p>';

        lucide.createIcons();
      } catch (e) {
        console.error(e);
      }
    }

    // Arxiv siyosati ko'rinib tursin: mijoz voqealar qancha saqlanishini bilsin.
    async function loadRetentionNote() {
      const note = document.getElementById('retentionNote');
      try {
        const r = await fetch('/api/retention').then(x => x.json());
        if (!r.enabled) { note.style.display = 'none'; return; }
        const total = r.events_total != null ? ` | arxivda ${r.events_total} voqea` : '';
        note.textContent = `Arxiv ${r.retention_days} kun saqlanadi — eskisi rasmlari bilan avtomatik o'chadi${total}`;
        note.style.display = 'block';
      } catch (e) {
        note.style.display = 'none';
      }
    }

    async function loadRecentEvents() {
      try {
        const evs = await fetch('/api/events').then(r => r.json());
        eventsTable.innerHTML = evs.map(ev => {
          const snap = ev.image_path ? `/api/snapshots/${ev.image_path.split('/').pop()}` : null;
          const thumb = snap
            ? `<img src="${snap}" alt="" style="width:36px;height:36px;border-radius:8px;object-fit:cover"/>`
            : `<i data-lucide="user-check"></i>`;
          return `
          <div class="history-item">
            <div class="avatar" style="background: var(--accent-green); overflow:hidden;">
              ${thumb}
            </div>
            <div class="item-info">
              <div class="item-name">${ev.person_name}</div>
              <div class="item-meta">Kamera: ${ev.camera_id}${ev.track_id != null ? ' | Track #' + ev.track_id : ''} | ${new Date(ev.timestamp).toLocaleTimeString()}</div>
            </div>
            <div class="match-score">${(ev.score * 100).toFixed(0)}%</div>
          </div>`;
        }).join('') || '<p style="text-align:center; padding:2rem; opacity:0.5;">Hozircha voqealar yo\'q</p>';
        lucide.createIcons();
        loadRetentionNote();
      } catch (e) {
        console.error(e);
      }
    }

    function connectWs() {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      const ws = new WebSocket(`${proto}://${location.host}/ws`);
      
      ws.onmessage = (ev) => {
        const data = JSON.parse(ev.data);
        if (data.type === 'event') {
          // Real-time notification logic
          loadRecentEvents();
          refreshData();
        }
      };
      
      ws.onclose = () => setTimeout(connectWs, 3000);
    }

    async function deletePerson(id, name) {
      if (!confirm(`"${name}" bazadan o'chirilsinmi?`)) return;
      try {
        const resp = await fetch(`/api/persons/${encodeURIComponent(id)}`, {
          method: 'DELETE',
          headers: apiHeaders(),
        });
        const res = await resp.json();
        if (res.ok) {
          refreshData();
        } else {
          alert('Xato: ' + (res.error || resp.status));
        }
      } catch (err) {
        alert('Xato: ' + err.message);
      }
    }

    btnApiKey.onclick = () => {
      const key = prompt('API kalit (X-API-Key):', sessionStorage.getItem('chaqimchi_api_key') || '');
      if (key !== null) sessionStorage.setItem('chaqimchi_api_key', key.trim());
    };

    // Zaxira nusxa: oddiy havola ishlamaydi — API kalit sarlavhada ketishi kerak,
    // shuning uchun blob orqali yuklab olamiz.
    btnBackup.onclick = async () => {
      btnBackup.disabled = true;
      try {
        const resp = await fetch('/api/backup', { headers: apiHeaders() });
        if (!resp.ok) {
          const msg = await resp.json().catch(() => ({}));
          alert('Xato: ' + (msg.error || (resp.status === 401 ? 'API kalit kerak' : resp.status)));
          return;
        }
        const disp = resp.headers.get('content-disposition') || '';
        const match = disp.match(/filename="([^"]+)"/);
        const blob = await resp.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = match ? match[1] : 'chaqimchi-nusxa.zip';
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      } catch (e) {
        alert('Xato: ' + e.message);
      } finally {
        btnBackup.disabled = false;
      }
    };

    btnCalibrate.onclick = async () => {
      try {
        const r = await fetch('/api/calibrate/threshold');
        const d = await r.json();
        if (!d.ok) {
          alert('Kalibrlash muvaffaqiyatsiz');
          return;
        }
        const apply = confirm(
          `Tavsiya: ${d.suggested_threshold}\nHozirgi: ${d.current_threshold}\n\n${d.notes}\n\nShu qiymatni hozir qo'llashni xohlaysizmi? (config.yaml ni ham yangilang)`
        );
        if (!apply) return;
        const headers = apiHeaders({ 'Content-Type': 'application/json' });
        const ar = await fetch('/api/calibrate/apply', { method: 'POST', headers });
        const applied = await ar.json();
        alert(applied.ok ? `Qo'llandi: ${applied.applied}` : 'Xato: ' + (applied.error || ar.status));
      } catch (e) {
        alert('Xato: ' + e.message);
      }
    };

    btnRegister.onclick = async () => {
      const name = prompt("Yangi shaxs ismini kiriting:");
      if (!name) return;
      
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.onchange = async (e) => {
        const file = e.target.files[0];
        const formData = new FormData();
        formData.append('file', file);
        formData.append('name', name);
        
        try {
          const resp = await fetch('/api/persons/add', {
            method: 'POST',
            body: formData,
            headers: apiHeaders(),
          });
          const res = await resp.json();
          if (res.ok) {
            alert("Muvaffaqiyatli qo'shildi!");
            refreshData();
          } else {
            alert("Xato: " + res.error);
          }
        } catch (err) {
          alert("Xato: " + err.message);
        }
      };
      input.click();
    };

    // Initial load
    refreshData();
    loadRecentEvents();
    connectWs();
    
    // Auto refresh every 30s
    setInterval(refreshData, 30000);
  </script>
</body>
</html>
